<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body style="margin: 0; font-size: large;">

    <header style="background-color: aqua; padding: 36px; text-align: center;">

        <h1>Student Registration Form</h1>

    </header>

    <nav style="display: flex; gap: 100px; background-color: antiquewhite; padding: 22px; justify-content: center;">

        <a href="Index.html">Home</a>
        <a href="Registration.html">Registration</a>
        <a href="GradeTable.html">Grade Table</a>
        <a href="Profile.html">My Profile</a>

    </nav>
    
    <div style="display: flex; background-color: bisque;">

        <section style="padding: 10px; height: 900px;">
            
            <div>
                <h5>Student Name</h5>
                <input type="text" name="username">
                <h5>Student Number</h5>
                <input type="text" name="username">
                <h5>Email</h5>
                <input type="text" name="username">
                <h5>Gender</h5>
                <input type="radio" id="male" name="gender" value="male"><label for="male">Male<label>
                <input type="radio" id="female" name="gender" value="female"><label for="female">Female<label>
                
                <h5>Course</h5>

                <form>
                    <label>Choose</label>
                        <select name="COURSE" id="course">

                            <option value="bsit">BSIT</option>

                        </select>

                </form>

                <h5>Skills</h5>

                <input type="checkbox" id="HTML" name="HTML" value="HTML"><label for="HTML"><label>HTML</label>
                <input type="checkbox" id="CSS" name="CSS" value="CSS"><label for="CSS">CSS<label></label>
                <input type="checkbox" id="JAVASCRIPT" name="JAVASCRIPT" value="JAVASCRIPT"><label for="JAVASCRIPT"><label>JAVASCRIPT</label>
                
                <h5>Upload Picture</h5>
                
                <input type="file">
                
                <h5>Address</h5>
                
                <textarea name="" id="" cols="30" rows="10"></textarea> <br>
                
                <input type="submit">
                <input type="reset">
            </div>
        </section>
    </div>

    <footer style="padding: 15px; text-align: center; background-color: thistle;">
        <h4>@Copyright 2026</h4>
    </footer>
    
</body>
</html>
